<!doctype html>
<html lang="en" data-elder="false">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emergency Help - Prevenza: Scam Guard</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="../dashboard/dashboard.css">
  <link rel="stylesheet" href="emergency.css">
</head>
<body>
  <header class="page-head">
    <div class="brand">
      <span data-mascot="52" aria-hidden="true"></span>
      <div>
        <div class="brand-name">Prevenza: Scam Guard</div>
        <div class="brand-sub">Emergency Help</div>
      </div>
    </div>
    <nav class="nav" aria-label="Pages">
      <a class="btn" href="../dashboard/dashboard.html" data-i18n="emg_back">Return to dashboard</a>
    </nav>
  </header>

  <main class="wrap emergency">
    <section class="card emg-intro" aria-labelledby="emg-h">
      <div class="emg-intro-text">
        <h1 id="emg-h" data-i18n="emergency_btn">Emergency Help</h1>
        <p class="muted" id="emg-calm"></p>
        <p class="notice" id="emg-lang-note" role="note" hidden></p>
      </div>
    </section>

    <section class="card" aria-labelledby="pick-h" id="pick-card">
      <h2 id="pick-h"></h2>
      <p class="muted small" id="pick-help"></p>
      <div class="incident-list" id="incident-list" role="group" aria-labelledby="pick-h"></div>
      <p class="problem" id="pick-msg" role="status" aria-live="polite" hidden></p>
    </section>

    <section class="card" aria-labelledby="steps-h" id="steps-card" hidden>
      <p class="muted small" id="steps-kicker"></p>
      <h2 id="steps-h" tabindex="-1"></h2>
      <div id="steps-body"></div>
    </section>
    <p class="muted" id="steps-empty"></p>

    <section class="card" aria-labelledby="report-h" id="report-card">
      <h2 id="report-h"></h2>
      <p id="report-intro"></p>
      <p class="notice" id="bank-reminder" role="note"></p>

      <div class="report-block">
        <h3 id="portal-h"></h3>
        <p class="portal-address" id="portal-address"></p>
        <div class="btn-row">
          <a class="btn btn-primary" id="portal-link" target="_blank" rel="noopener noreferrer"></a>
        </div>
      </div>

      <div class="report-block">
        <h3 id="helpline-h"></h3>
        <p class="helpline-number" id="helpline-number"></p>
        <div class="btn-row">
          <button class="btn" type="button" id="copy-helpline"></button>
        </div>
        <p class="muted small" id="copy-status" role="status" aria-live="polite"></p>
      </div>

      <details class="emg-more" id="report-more">
        <summary id="report-more-summary">More about reporting</summary>
        <div id="report-more-body"></div>
      </details>
    </section>

    <section class="card" aria-labelledby="complaint-h" id="complaint-card">
      <h2 id="complaint-h"></h2>
      <p id="complaint-intro"></p>
      <ul class="complaint-list" id="complaint-list"></ul>
      <p class="notice" id="complaint-never" role="note"></p>
      <h3 id="complaint-template-h"></h3>
      <pre class="complaint-template" id="complaint-template" tabindex="0" aria-describedby="complaint-help"></pre>
      <p class="muted small" id="complaint-help"></p>
    </section>

    <section class="card" aria-labelledby="trust-emg-h" id="trust-card">
      <h2 id="trust-emg-h"></h2>
      <p id="trust-sentence"></p>
      <div id="trust-slot"></div>
    </section>

    <div class="btn-row emg-back">
      <a class="btn btn-primary" href="../dashboard/dashboard.html" data-i18n="emg_back">Return to dashboard</a>
    </div>
  </main>

  <script src="../shared/constants.js"></script>
  <script src="../shared/settings.js"></script>
  <script src="../shared/mascot.js"></script>
  <script src="../shared/messaging.js"></script>
  <script src="../shared/ui.js"></script>
  <script src="../shared/elder-text.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/family-guide.js"></script>
  <script src="../shared/emergency.js"></script>
  <script src="emergency.js"></script>
</body>
</html>
